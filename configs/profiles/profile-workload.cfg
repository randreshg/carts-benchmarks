# ARTS Counter Profile: WORKLOAD CHARACTERIZATION
# ================================================
#
# Captures workload metrics at CLUSTER level for understanding runtime behavior:
# - Task execution patterns (EDT counts, running time)
# - Data block operations
# - Memory usage
# - Communication patterns
#
# Usage:
#   carts build --arts --counters=2
#   carts build --arts --profile=profile-workload.cfg

# EDT Counters - task execution patterns
TIME_EDT_EXEC=PERIODIC,CLUSTER
NUM_EDT_CREATE=PERIODIC,CLUSTER
NUM_EDT_ACQUIRE=PERIODIC,CLUSTER
NUM_EDT_FINISH=PERIODIC,CLUSTER

# DB Counters - data block patterns
NUM_DB_CREATE=PERIODIC,CLUSTER

# Memory Counters
BYTES_MEMORY_FOOTPRINT=PERIODIC,CLUSTER

# Remote Counters - communication patterns
BYTES_REMOTE_SENT=PERIODIC,CLUSTER
BYTES_REMOTE_RECEIVED=PERIODIC,CLUSTER
NUM_REMOTE_SEND=PERIODIC,CLUSTER
NUM_REMOTE_RECEIVE=PERIODIC,CLUSTER

# Timing Counters
TIME_INIT=ONCE,CLUSTER,MASTER
TIME_TOTAL=ONCE,CLUSTER,MASTER

# Acquire-Mode Counters
NUM_DB_ACQUIRE_READ=OFF
NUM_DB_ACQUIRE_WRITE=OFF
NUM_OWNER_UPDATE_SAVED=OFF
NUM_OWNER_UPDATE_PERFORMED=OFF

# ArtsID Tracking
OBJ_NUM_EDT=OFF
OBJ_NUM_DB=OFF
OBJ_TRACE_EDT=OFF
OBJ_TRACE_DB=OFF
