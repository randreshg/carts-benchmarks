# ARTS Counter Profile: COMMUNICATION SUMMARY
# ===========================================
#
# Captures cluster-level communication counters for multinode scalability
# studies with lower perturbation than the full overhead profile.
#
# Use this when the experiment needs transport/runtime metrics for all
# benchmarks, but the timing result should still be comparable to the
# counter-free scalability sweep.

# Task and DB lifecycle counters
TIME_EDT_EXEC=OFF
NUM_EDT_CREATE=OFF
NUM_EDT_ACQUIRE=OFF
NUM_EDT_FINISH=OFF
NUM_DB_CREATE=OFF

# Memory footprint
BYTES_MEMORY_FOOTPRINT=ONCE,CLUSTER

# Remote communication
BYTES_REMOTE_SENT=ONCE,CLUSTER
BYTES_REMOTE_RECEIVED=ONCE,CLUSTER
NUM_REMOTE_SEND=ONCE,CLUSTER
NUM_REMOTE_RECEIVE=ONCE,CLUSTER
NUM_REMOTE_CONNECT_ATTEMPT=ONCE,CLUSTER
NUM_REMOTE_CONNECT_SUCCESS=ONCE,CLUSTER
NUM_REMOTE_CONNECT_FAIL=ONCE,CLUSTER
NUM_REMOTE_CONNECT_TIMEOUT=ONCE,CLUSTER
NUM_REMOTE_CONNECT_ABANDONED=ONCE,CLUSTER
NUM_REMOTE_ACCEPT_ATTEMPT=ONCE,CLUSTER
NUM_REMOTE_ACCEPT_SUCCESS=ONCE,CLUSTER
NUM_REMOTE_ACCEPT_EAGAIN=ONCE,CLUSTER
NUM_REMOTE_CLOSE_AFTER_SEND=ONCE,CLUSTER
NUM_REMOTE_SEND_EAGAIN=ONCE,CLUSTER
NUM_REMOTE_SEND_PARTIAL=ONCE,CLUSTER
NUM_REMOTE_RECV_EAGAIN=ONCE,CLUSTER
NUM_REMOTE_RECV_PARTIAL=ONCE,CLUSTER
NUM_REMOTE_PENDING_RECV_PROMOTE=ONCE,CLUSTER

# Runtime timing
TIME_INIT=ONCE,CLUSTER,MASTER
TIME_TOTAL=ONCE,CLUSTER,MASTER

# Acquire-mode counters
NUM_DB_ACQUIRE_READ=OFF
NUM_DB_ACQUIRE_WRITE=OFF
NUM_OWNER_UPDATE_SAVED=OFF
NUM_OWNER_UPDATE_PERFORMED=OFF

# ArtsID tracking
OBJ_NUM_EDT=OFF
OBJ_NUM_DB=OFF
OBJ_TRACE_EDT=OFF
OBJ_TRACE_DB=OFF
