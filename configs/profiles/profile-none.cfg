# ARTS Counter Profile: ALL OFF
# ==============================
#
# Use for baseline performance measurements without counter overhead.
#
# Usage:
#   carts build --arts --counters=0
#   carts build --arts --profile=profile-none.cfg

# EDT Counters
TIME_EDT_EXEC=OFF
NUM_EDT_CREATE=OFF
NUM_EDT_ACQUIRE=OFF
NUM_EDT_FINISH=OFF

# DB Counters
NUM_DB_CREATE=OFF

# Memory Counters
BYTES_MEMORY_FOOTPRINT=OFF

# Remote Counters
BYTES_REMOTE_SENT=OFF
BYTES_REMOTE_RECEIVED=OFF

# Timing Counters
TIME_INIT=OFF
TIME_TOTAL=OFF

# Acquire-Mode Counters
NUM_DB_ACQUIRE_READ=OFF
NUM_DB_ACQUIRE_WRITE=OFF
NUM_OWNER_UPDATE_SAVED=OFF
NUM_OWNER_UPDATE_PERFORMED=OFF

# ArtsID Tracking
OBJ_NUM_EDT=OFF
OBJ_NUM_DB=OFF
OBJ_TRACE_EDT=OFF
OBJ_TRACE_DB=OFF
