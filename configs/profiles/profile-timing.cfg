# ARTS Counter Profile: TIMING ONLY (DEFAULT)
# ============================================
#
# Captures only initialization and end-to-end timing with minimal overhead.
# This is the default profile for benchmarking.
#
# Usage:
#   carts build --arts --counters=1
#   carts build --arts --profile=profile-timing.cfg

# EDT Counters
TIME_EDT_EXEC=OFF
NUM_EDT_CREATE=OFF
NUM_EDT_ACQUIRE=OFF
NUM_EDT_FINISH=OFF

# DB Counters
NUM_DB_CREATE=OFF

# Memory Counters
BYTES_MEMORY_FOOTPRINT=OFF

# Remote Counters
BYTES_REMOTE_SENT=OFF
BYTES_REMOTE_RECEIVED=OFF

# Timing Counters (ENABLED)
TIME_INIT=ONCE,CLUSTER,MASTER
TIME_TOTAL=ONCE,CLUSTER,MASTER

# Acquire-Mode Counters
NUM_DB_ACQUIRE_READ=OFF
NUM_DB_ACQUIRE_WRITE=OFF
NUM_OWNER_UPDATE_SAVED=OFF
NUM_OWNER_UPDATE_PERFORMED=OFF

# ArtsID Tracking
OBJ_NUM_EDT=OFF
OBJ_NUM_DB=OFF
OBJ_TRACE_EDT=OFF
OBJ_TRACE_DB=OFF
